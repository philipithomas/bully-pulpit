name: Check

on:
  push:
    branches: [main]
  # Stacked design PRs need the same checks as PRs targeting main.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Unit tests
        run: pnpm test

      - name: Bell deterministic evaluations
        run: pnpm bell:eval

      # Fails the PR if a content change did not regenerate the committed
      # search index (merkle root mismatch) or any other generated artifact.
      - name: Content pipeline check (images + search index)
        run: pnpm content:check

      - name: Internal link check
        run: pnpm links:check

      - name: Build
        run: pnpm build
